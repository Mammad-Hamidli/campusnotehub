# Builds the native Windows installer (desktop/, Tauri 2 + NSIS).
#
# - Release (Actions tab -> "Desktop - Windows installer" -> Run workflow on main,
#   release = patch/minor/major): bumps every version file (desktop/scripts/version.mjs),
#   commits and pushes the bump with tag desktop-vX.Y.Z, builds, and publishes a
#   GitHub Release. The site's download buttons and the in-app update notice pick
#   it up within 10 minutes.
# - Tag push `desktop-vX.Y.Z` made by hand: same build and release, after checking
#   the tag equals the version in every file.
# - Run workflow with release = none, or any PR touching desktop/: build only; the
#   setup .exe is uploaded as a workflow artifact.
#
# The web app is not built here: the desktop shell loads https://www.campusnotehub.com.
#
# Code signing (Azure Artifact Signing) switches on once the repository has the
# variable AZURE_SIGNING_ACCOUNT - see desktop/README.md "Code signing". Tauri then
# signs the app exe, the uninstaller and the installer with the same command.
name: Desktop - Windows installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a new version (none = build only)
        type: choice
        options: [none, patch, minor, major]
        default: none
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']

# Only superseded PR builds are cancelled: cancelling a release after its tag
# was pushed would leave a tag with no GitHub Release behind it.
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # the version-bump push and the release; PR runs from forks get read-only
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Pushed with GITHUB_TOKEN, so the tag does not start a second run of this
      # workflow; this run builds and publishes it.
      - name: Bump version, commit and tag
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.release != 'none'
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, not $GITHUB_REF_NAME"
            exit 1
          fi
          version="$(node scripts/version.mjs "$RELEASE")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --message "Release campusnotehub for Windows $version"
          git tag "desktop-v$version"
          git push --atomic origin HEAD:main "desktop-v$version"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"

      - name: Check version files
        id: release
        shell: bash
        env:
          BUMPED_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          tag="$BUMPED_TAG"
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then tag="$GITHUB_REF_NAME"; fi
          node scripts/version.mjs --check ${tag:+"${tag#desktop-v}"}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Configure code signing
        id: signing
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command artifact-signing-cli -ErrorAction SilentlyContinue)) {
            cargo install artifact-signing-cli --locked
          }
          # An overlay merged with --config, so local builds stay unsigned and need no tooling.
          $command = "artifact-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d campusnotehub %1"
          $path = Join-Path $env:RUNNER_TEMP 'tauri.signing.json'
          @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 4 | Set-Content -Path $path -Encoding utf8NoBOM
          "config=$path" >> $env:GITHUB_OUTPUT

      - name: Warn about an unsigned release
        if: steps.release.outputs.tag != '' && steps.signing.outcome != 'success'
        run: echo "::warning::This release is UNSIGNED - Windows SmartScreen will show 'Unknown publisher'. See desktop/README.md, Code signing."

      - name: Build installer
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:SIGNING_CONFIG) { npx tauri build --config $env:SIGNING_CONFIG } else { npx tauri build }

      - name: Verify signature
        if: steps.signing.outcome == 'success'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): signature is $($signature.Status)" }
            "$($file.Name): signed by $($signature.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: campusnotehub-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: >
          gh release create "$TAG"
          src-tauri/target/release/bundle/nsis/*-setup.exe
          --title "campusnotehub for Windows ${TAG#desktop-v}"
          --generate-notes
