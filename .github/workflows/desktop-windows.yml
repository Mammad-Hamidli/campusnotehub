# Builds the native Windows installer (desktop/, Tauri 2 + NSIS).
#
# - Manual run (Actions tab -> "Desktop - Windows installer" -> Run workflow) or any
#   PR touching desktop/: the setup .exe is uploaded as a workflow artifact.
# - Tag push `desktop-vX.Y.Z` (X.Y.Z must equal desktop/package.json "version"):
#   same build, then the .exe is attached to a GitHub Release for that tag.
#
# The web app is not built here: the desktop shell loads https://www.campusnotehub.com.
#
# Code signing (Azure Artifact Signing) switches on once the repository has the
# variable AZURE_SIGNING_ACCOUNT - see desktop/README.md "Code signing". Tauri then
# signs the app exe, the uninstaller and the installer with the same command.
name: Desktop - Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # only used by the release step, which runs on tags only
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Check tag matches desktop/package.json version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#desktop-v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json version $version"
            exit 1
          fi

      - run: npm ci

      - name: Configure code signing
        id: signing
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command artifact-signing-cli -ErrorAction SilentlyContinue)) {
            cargo install artifact-signing-cli --locked
          }
          # An overlay merged with --config, so local builds stay unsigned and need no tooling.
          $command = "artifact-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d campusnotehub %1"
          $path = Join-Path $env:RUNNER_TEMP 'tauri.signing.json'
          @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 4 | Set-Content -Path $path -Encoding utf8NoBOM
          "config=$path" >> $env:GITHUB_OUTPUT

      - name: Warn about an unsigned release
        if: startsWith(github.ref, 'refs/tags/desktop-v') && steps.signing.outcome != 'success'
        run: echo "::warning::This release is UNSIGNED - Windows SmartScreen will show 'Unknown publisher'. See desktop/README.md, Code signing."

      - name: Build installer
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:SIGNING_CONFIG) { npx tauri build --config $env:SIGNING_CONFIG } else { npx tauri build }

      - name: Verify signature
        if: steps.signing.outcome == 'success'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): signature is $($signature.Status)" }
            "$($file.Name): signed by $($signature.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: campusnotehub-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          src-tauri/target/release/bundle/nsis/*-setup.exe
          --title "campusnotehub for Windows ${GITHUB_REF_NAME#desktop-v}"
          --generate-notes
